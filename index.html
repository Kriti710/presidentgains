<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>President Gains</title>
<meta name="description" content="A Mario-style platformer. Eggs and milk make you swole.">
<meta name="theme-color" content="#0e1420">
<link rel="icon" href="assets/sprites/head.png">
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; background: #0e1420; overflow: hidden;
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    touch-action: none; overscroll-behavior: none;
  }
  /* #app stacks the game and the control bar top-to-bottom, so on a portrait
     phone the game keeps its 1280x720 (16:9) shape — letterboxed by KAPLAY
     inside #wrap — while the controls live in their own reserved strip below
     it instead of floating on top of the play area. */
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; touch-action: none; }
  /* KAPLAY stretches the canvas to exactly 100%/100% of this box itself (it
     letterboxes the 16:9 game internally), so #wrap just needs to be a plain,
     definitely-sized box — a grid/flex parent with center-alignment made the
     canvas's own 100% resolve against a stale size instead of this box. */
  #wrap { flex: 1 1 auto; min-height: 0; min-width: 0; position: relative; overflow: hidden; touch-action: none; }
  canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; touch-action: none; }

  /* ---- touch controls: a real row below the game, only on touch devices ---- */
  #touch {
    display: none; flex: 0 0 auto; width: 100%;
    align-items: center; justify-content: space-between;
    gap: clamp(10px, 4vw, 24px);
    padding: 10px max(16px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom))
             max(16px, env(safe-area-inset-left));
    background: #0b0f18; border-top: 1px solid rgba(255,255,255,.08);
  }
  body.touch #touch { display: flex; }
  #touch .pad { display: flex; gap: clamp(12px, 3.5vw, 18px); }
  #touch button {
    width: clamp(62px, 17vw, 92px); height: clamp(62px, 17vw, 92px);
    border-radius: 18px; border: 2px solid rgba(255,255,255,.35);
    background: rgba(255,255,255,.08); color: #fff;
    font: 700 clamp(18px, 5.5vw, 30px)/1 ui-monospace, monospace;
    touch-action: none;
  }
  #touch button:active { background: rgba(255,255,255,.3); }
  #touch .jump {
    width: clamp(76px, 21vw, 116px); height: clamp(76px, 21vw, 116px);
    border-radius: 50%; font-size: clamp(13px, 3.8vw, 17px); letter-spacing: .5px;
  }
</style>
</head>
<body>
  <div id="app">
    <div id="wrap"><canvas id="game"></canvas></div>

    <div id="touch">
      <div class="pad left">
        <button data-key="left" aria-label="Left">◀</button>
        <button data-key="right" aria-label="Right">▶</button>
      </div>
      <div class="pad right">
        <button class="jump" data-key="space" aria-label="Jump">JUMP</button>
      </div>
    </div>
  </div>

  <script>
    /* Some embeddings (the Claude artifact viewer, and any iframe with a
       restrictive permissions policy) block the Gamepad API. KAPLAY polls
       navigator.getGamepads() every frame, so a blocked call throws on the
       first frame and the game never starts. Report "no gamepads" instead.
       Real controllers still work wherever the policy allows them. */
    (function () {
      var orig = null;
      try { orig = navigator.getGamepads && navigator.getGamepads.bind(navigator); } catch (e) {}
      var safe = function () {
        try { return orig ? (orig() || []) : []; } catch (e) { return []; }
      };
      var desc = { value: safe, configurable: true, writable: true };
      try { Object.defineProperty(navigator, "getGamepads", desc); }
      catch (e) {
        try { Object.defineProperty(Navigator.prototype, "getGamepads", desc); } catch (e2) {}
      }
    })();

    /* `touch-action: none` covers most browsers, but a double-tap (or, on
       desktop, a double-click) can still trigger native zoom on some mobile
       Safari / older Android builds. Block it explicitly: a second tap/click
       landing within 350ms of the last one is swallowed, and pinch-zoom
       gesture events (Safari-only) are blocked outright. Buttons and links
       still work fine — this only stops the SECOND event of a fast double,
       not taps in general. */
    (function () {
      var lastT = 0;
      var kill = function (e) {
        var now = Date.now();
        if (now - lastT < 350) e.preventDefault();
        lastT = now;
      };
      document.addEventListener("touchend", kill, { passive: false });
      document.addEventListener("dblclick", function (e) { e.preventDefault(); }, { passive: false });
      document.addEventListener("gesturestart", function (e) { e.preventDefault(); }, { passive: false });
    })();
  </script>
  <script src="vendor/kaplay.js"></script>
  <script src="src/level.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
