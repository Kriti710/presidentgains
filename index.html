<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>President Gains</title>
<meta name="description" content="A Mario-style platformer. Eggs and milk make you swole.">
<meta name="theme-color" content="#0e1420">
<link rel="icon" href="assets/sprites/head.png">
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; background: #0e1420; overflow: hidden;
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  #wrap { position: fixed; inset: 0; display: grid; place-items: center; }
  canvas { display: block; max-width: 100%; max-height: 100%; image-rendering: pixelated; }

  /* ---- touch controls (only shown on touch devices) ---- */
  #touch { position: fixed; inset: 0; display: none; pointer-events: none; z-index: 5; }
  body.touch #touch { display: block; }
  #touch .pad { position: absolute; bottom: max(18px, env(safe-area-inset-bottom)); pointer-events: auto; display: flex; gap: 14px; }
  #touch .left { left: max(18px, env(safe-area-inset-left)); }
  #touch .right { right: max(18px, env(safe-area-inset-right)); }
  #touch button {
    width: 76px; height: 76px; border-radius: 18px; border: 2px solid rgba(255,255,255,.35);
    background: rgba(14,20,32,.55); color: #fff; font: 700 26px/1 ui-monospace, monospace;
    backdrop-filter: blur(4px); touch-action: none;
  }
  #touch button:active { background: rgba(255,255,255,.3); }
  #touch .jump { width: 96px; height: 96px; border-radius: 50%; font-size: 15px; letter-spacing: .5px; }

  #rotate {
    position: fixed; inset: 0; display: none; place-items: center; text-align: center;
    background: #0e1420; color: #cfe3ff; z-index: 20; padding: 24px; font-size: 15px; line-height: 1.6;
  }
  @media (max-width: 820px) and (orientation: portrait) { body.touch #rotate { display: grid; } }
</style>
</head>
<body>
  <div id="wrap"><canvas id="game"></canvas></div>

  <div id="touch">
    <div class="pad left">
      <button data-key="left" aria-label="Left">◀</button>
      <button data-key="right" aria-label="Right">▶</button>
    </div>
    <div class="pad right">
      <button data-key="shift" aria-label="Run">RUN</button>
      <button class="jump" data-key="space" aria-label="Jump">JUMP</button>
    </div>
  </div>

  <div id="rotate">Turn your phone sideways<br>to play President Gains</div>

  <script src="vendor/kaplay.js"></script>
  <script src="src/level.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
