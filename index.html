<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>President Gains</title>
<meta name="description" content="A Mario-style platformer. Eggs and milk make you swole.">
<meta name="theme-color" content="#0e1420">
<link rel="icon" href="assets/sprites/head.png">

<!-- Open Graph / Twitter Card — so links shared in WhatsApp, iMessage,
     Slack, Discord, etc. show a real preview card instead of text-only -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://presidentgains.pages.dev/">
<meta property="og:title" content="President Gains">
<meta property="og:description" content="A Mario-style platformer. Eggs and milk make you swole.">
<meta property="og:image" content="https://presidentgains.pages.dev/assets/og-banner.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="President Gains">
<meta name="twitter:description" content="A Mario-style platformer. Eggs and milk make you swole.">
<meta name="twitter:image" content="https://presidentgains.pages.dev/assets/og-banner.png">
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; background: #0e1420; overflow: hidden;
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    touch-action: none; overscroll-behavior: none;
  }
  /* #app stacks the game and the control bar top-to-bottom, bottom-anchored
     (justify-content: flex-end) so the two sit flush against each other —
     any leftover space (a portrait phone is much taller than 16:9) collects
     above the game instead of as a gap between the game and the buttons. */
  #app {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    justify-content: flex-end; align-items: center; touch-action: none;
  }
  /* #wrap is sized in JS (see the layout script below) to exactly the 16:9
     box that fits the available space, instead of stretching to fill it —
     that stretching is what let KAPLAY's own internal letterboxing eat a
     huge chunk of a tall phone screen as dead space between game and
     buttons. width/height here are just a pre-JS fallback. */
  #wrap { width: 100%; aspect-ratio: 16 / 9; max-height: 100%; position: relative; overflow: hidden; touch-action: none; }
  canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; touch-action: none; }

  /* ---- touch controls: a real row below the game, only on touch devices ----
     "Pixel UI kit" style buttons: rounded-square, banded coloring (a light
     top strip, solid body, dark bottom lip — hard color stops, no smooth
     blend) with a thick black outline, matching a classic pixel-art button
     asset pack rather than a smooth modern gradient. */
  #touch {
    display: none; flex: 0 0 auto; width: 100%;
    align-items: center; justify-content: space-between;
    gap: clamp(10px, 4vw, 24px);
    /* light top padding + heavy bottom padding pushes the buttons toward the
       top of this strip — closer to the game, further from the screen edge —
       while the whole row still stays fully below the game, never over it */
    padding: 4px max(16px, env(safe-area-inset-right))
             max(42px, calc(env(safe-area-inset-bottom) + 30px))
             max(16px, env(safe-area-inset-left));
    background: #0b0f18; border-top: 1px solid rgba(255,255,255,.08);
  }
  body.touch #touch { display: flex; }
  #touch .pad { display: flex; }
  #touch button {
    border: 4px solid #0a0a0c; color: #fff;
    text-shadow: 0 2px 0 rgba(0,0,0,.35);
    font: 800 clamp(18px, 5.5vw, 30px)/1 ui-monospace, monospace;
    touch-action: none; transition: transform .04s, box-shadow .04s;
  }
  #touch button:active { transform: translate(4px, 4px); }

  /* d-pad: two buttons fused into one banded-green slab — hard color stops
     (light strip / body / dark lip) instead of a smooth gradient, rounded
     pixel-style corners, a hard offset shadow for depth */
  .pad.left {
    background: linear-gradient(180deg, #8be89a 0 16%, #3fae4a 16% 78%, #1f6b28 78% 100%);
    border: 4px solid #0a0a0c; border-radius: 16px;
    box-shadow: 5px 5px 0 #0a0a0c;
  }
  .pad.left:active { box-shadow: none; transform: translate(5px, 5px); }
  .pad.left button {
    width: clamp(58px, 16vw, 86px); height: clamp(58px, 16vw, 86px);
    border: none; background: transparent;
    box-shadow: none; transform: none !important;
  }
  .pad.left button:first-child { border-right: 3px solid rgba(10,10,12,.5); }
  .pad.left button:active { background: rgba(0,0,0,.15); }

  /* jump: a banded orange-red action button, pixel-UI-kit style, round to
     match the circular buttons (arrows/check/x) in that same asset style */
  #touch .jump {
    width: clamp(80px, 22vw, 122px); height: clamp(80px, 22vw, 122px);
    border-radius: 50%; border: 4px solid #0a0a0c;
    background: linear-gradient(180deg, #ffb37a 0 18%, #e8562a 18% 76%, #8a2a12 76% 100%);
    box-shadow: 6px 6px 0 #0a0a0c;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  }
  #touch .jump:active { box-shadow: none; transform: translate(6px, 6px); }
  #touch .jump .jlabel { font-size: clamp(14px, 4vw, 18px); font-weight: 800; letter-spacing: .5px; }
  #touch .jump .jhint {
    font-size: clamp(7.5px, 2.1vw, 9.5px); font-weight: 700; letter-spacing: .2px;
    opacity: .9; text-transform: uppercase;
  }
</style>
</head>
<body>
  <div id="app">
    <div id="wrap"><canvas id="game"></canvas></div>

    <div id="touch">
      <div class="pad left">
        <button data-key="left" aria-label="Left">◀</button>
        <button data-key="right" aria-label="Right">▶</button>
      </div>
      <div class="pad right">
        <button class="jump" data-key="space" aria-label="Jump — hold for a higher jump">
          <span class="jlabel">JUMP</span>
          <span class="jhint">hold = higher</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    /* Some embeddings (the Claude artifact viewer, and any iframe with a
       restrictive permissions policy) block the Gamepad API. KAPLAY polls
       navigator.getGamepads() every frame, so a blocked call throws on the
       first frame and the game never starts. Report "no gamepads" instead.
       Real controllers still work wherever the policy allows them. */
    (function () {
      var orig = null;
      try { orig = navigator.getGamepads && navigator.getGamepads.bind(navigator); } catch (e) {}
      var safe = function () {
        try { return orig ? (orig() || []) : []; } catch (e) { return []; }
      };
      var desc = { value: safe, configurable: true, writable: true };
      try { Object.defineProperty(navigator, "getGamepads", desc); }
      catch (e) {
        try { Object.defineProperty(Navigator.prototype, "getGamepads", desc); } catch (e2) {}
      }
    })();

    /* `touch-action: none` covers most browsers, but a double-tap (or, on
       desktop, a double-click) can still trigger native zoom on some mobile
       Safari / older Android builds. Block it explicitly: a second tap/click
       landing within 350ms of the last one is swallowed, and pinch-zoom
       gesture events (Safari-only) are blocked outright. Buttons and links
       still work fine — this only stops the SECOND event of a fast double,
       not taps in general. */
    (function () {
      var lastT = 0;
      var kill = function (e) {
        var now = Date.now();
        if (now - lastT < 350) e.preventDefault();
        lastT = now;
      };
      document.addEventListener("touchend", kill, { passive: false });
      document.addEventListener("dblclick", function (e) { e.preventDefault(); }, { passive: false });
      document.addEventListener("gesturestart", function (e) { e.preventDefault(); }, { passive: false });
    })();

    /* Size #wrap to exactly the 16:9 box that fits the space above the
       control bar, instead of letting it stretch to fill that whole space
       and leaving KAPLAY's own internal letterboxing to eat the rest as
       dead space — a portrait phone is much taller than 16:9, so that dead
       space could be huge. Re-measured on resize/orientation change and
       whenever the control bar's own size changes (it's 0-height until the
       "touch" class is added, and its height also varies with the safe-area
       insets). */
    (function () {
      var wrap = document.getElementById("wrap");
      var touchBar = document.getElementById("touch");
      function layout() {
        var totalH = window.innerHeight;
        var totalW = window.innerWidth;
        var barH = touchBar.offsetHeight;
        var availH = Math.max(0, totalH - barH);
        var w = totalW, h = w * 9 / 16;
        if (h > availH) { h = availH; w = h * 16 / 9; }
        wrap.style.width = w + "px";
        wrap.style.height = h + "px";
      }
      layout();
      window.addEventListener("resize", layout);
      window.addEventListener("orientationchange", layout);
      if (window.ResizeObserver) new ResizeObserver(layout).observe(touchBar);
      // Belt and suspenders: main.js adds body.classList "touch" (which is
      // what actually flips the control bar from display:none to a real
      // height) slightly after this script runs. That's exactly the kind of
      // 0-height-to-real-height transition ResizeObserver is supposed to
      // catch, but it isn't reliable for this specific case in testing —
      // watch the class attribute directly instead, since that's the real
      // trigger, not just a proxy for it.
      if (window.MutationObserver) {
        new MutationObserver(layout).observe(document.body, { attributes: true, attributeFilter: ["class"] });
      }
    })();
  </script>
  <script src="vendor/kaplay.js"></script>
  <script src="src/level.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
